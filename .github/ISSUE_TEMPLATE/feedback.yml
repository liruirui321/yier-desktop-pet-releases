name: 使用反馈或建议
description: 报告问题、提出新玩法或改进建议
title: "[反馈] "
body:
  - type: dropdown
    id: type
    attributes:
      label: 反馈类型
      options: [使用问题, 功能建议, 动画或语音建议, 其他]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本和操作系统
      placeholder: 例如 v0.2.2，macOS 15，M4
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 发生了什么，或希望增加什么？
      description: 问题请写出操作步骤、实际结果和预期结果，可以附截图；请隐去个人信息。
    validations:
      required: true
